<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3366ff"/>
      <stop offset="100%" style="stop-color:#1a44f5"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="102" fill="url(#bg)"/>
  <!-- Owl body -->
  <ellipse cx="256" cy="300" rx="120" ry="140" fill="#eef4ff" opacity="0.95"/>
  <!-- Left eye -->
  <circle cx="216" cy="260" r="40" fill="white"/>
  <circle cx="216" cy="260" r="20" fill="#121b57"/>
  <circle cx="222" cy="252" r="7" fill="white"/>
  <!-- Right eye -->
  <circle cx="296" cy="260" r="40" fill="white"/>
  <circle cx="296" cy="260" r="20" fill="#121b57"/>
  <circle cx="302" cy="252" r="7" fill="white"/>
  <!-- Beak -->
  <polygon points="256,285 244,305 268,305" fill="#f59e0b"/>
  <!-- Ear tufts -->
  <polygon points="180,180 200,240 160,230" fill="#bcd2ff"/>
  <polygon points="332,180 312,240 352,230" fill="#bcd2ff"/>
  <!-- Belly pattern -->
  <ellipse cx="256" cy="360" rx="50" ry="60" fill="#d9e6ff" opacity="0.6"/>
</svg>
